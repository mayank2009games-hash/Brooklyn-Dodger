<script>

 for(let k=0;k<n;k++){const l=k%4,t=rnd()<(cfg.route==2?.65:.35)?1:rnd()<.2?2:0;cars.push({z:(k/n)*TL+rnd()*300+3000,off:ln[l]+(rnd()-.5)*.1,spd:sp[l],base:sp[l],t,c:t==1?'#f2b705':cl[Math.floor(rnd()*6)]})}if(cfg.mode==1)cars.push({cop:1,t:4,c:'#1c2a52',z:(pos+PZ-3500+TL)%TL,off:0,spd:0});copGap=3500;chT=0}

let AC,mG,sG,eng,eG,ns=0;
function ia(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}

 eng=AC.createOscillator();eng.type='sawtooth';const f=AC.createBiquadFilter();f.frequency.value=500;eG=AC.createGain();eG.gain.value=0;eng.connect(f);f.connect(eG);eG.connect(sG);eng.start();vol();
 const b=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);ns=b;
 let st=0,nt=AC.currentTime+.1;const RT=[[55,43.65,65.41,49],[49,61.74,55,65.41],[41.2,55,36.71,49]],AR=[[1,1.5,2,3],[1,1.25,1.5,2],[1,2,1.5,3]],BP=[116,126,98];

 if(t==2)ctx.fillRect(x-w*.48,y-h,w*.96,h*.5);else{ctx.beginPath();ctx.moveTo(x-w*.4,y-h*.58);ctx.lineTo(x-w*.3,y-h);ctx.lineTo(x+w*.3,y-h);ctx.lineTo(x+w*.4,y-h*.58);ctx.fill()}

 ctx.fillStyle=brk?'#ff3030':'#b01818';ctx.fillRect(x-w*.47,y-h*.52,w*.22,h*.13);ctx.fillRect(x+w*.25,y-h*.52,w*.22,h*.13);
 ctx.fillStyle='#222';ctx.fillRect(x-w*.5,y-h*.2,w,h*.1);if(t==1){ctx.fillStyle='#fff';ctx.fillRect(x-w*.13,y-h*1.1,w*.26,h*.1)}if(t==4){ctx.fillStyle=(Date.now()>>7)&1?'#f22':'#26f';ctx.fillRect(x-w*.3,y-h*1.1,w*.6,h*.1)}}

 const k=HZ/560,P=x=>((x*PER/1500-sky)%PER+PER)%PER-PER*.1;
 if(PL.s){const sx=W*PL.s[0],sy=HZ*PL.s[1],r=HZ*.5,gr=ctx.createRadialGradient(sx,sy,0,sx,sy,r);gr.addColorStop(0,PL.s[2]);gr.addColorStop(.12,PL.s[2]);gr.addColorStop(.13,'rgba(255,220,150,.35)');gr.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=gr;ctx.fillRect(sx-r,sy-r,r*2,r*2)}
 if(PL.n){ctx.fillStyle='#fff';for(let i=0;i<70;i++)ctx.fillRect((i*977%1000)/1000*W,(i*613%1000)/1000*HZ*.85,1+(i%3==0),1+(i%3==0));ctx.fillStyle='#f4f0d8';ctx.beginPath();ctx.arc(W*.8,HZ*.25,HZ*.06,0,7);ctx.fill()}
 ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<6;i++){const x=P(i*520+90),y=HZ*(.15+.1*(i%3));ctx.beginPath();ctx.ellipse(x,y,70*k*2,14*k*2,0,0,7);ctx.fill()}
 sk.forEach(b=>{const x=P(b.x),sh=150+b.c*40|0;ctx.fillStyle=`rgb(${sh-30},${sh-12},${sh+10})`;ctx.fillRect(x,HZ-b.h*k,b.w*k,b.h*k+2)});
 [[900,64,470,1],[900,64,440,0]].forEach(([bx,w,h,a])=>{const ww=w*k,x=P(bx)+(a?0:ww*1.6),hh=h*k;ctx.fillStyle='#c9d1d9';ctx.fillRect(x,HZ-hh,ww,hh+2);ctx.fillStyle='#8f9aa6';ctx.fillRect(x+ww*.72,HZ-hh,ww*.28,hh+2);
  ctx.fillStyle='rgba(60,70,85,.35)';for(let i=1;i<9;i++)ctx.fillRect(x+ww*i/9,HZ-hh,Math.max(1,k*.8),hh);if(a){ctx.fillStyle='#aab';ctx.fillRect(x+ww*.47,HZ-hh-70*k,ww*.06,70*k)}});
 {const sx=P(640),u=k*1.6;ctx.fillStyle='#6e8a6a';ctx.fillRect(sx-30*u,HZ-5*u,60*u,6*u);ctx.fillStyle='#9a9ea6';ctx.fillRect(sx-9*u,HZ-36*u,18*u,32*u);ctx.fillStyle='#5f9a88';ctx.beginPath();ctx.moveTo(sx-8*u,HZ-36*u);ctx.lineTo(sx-5*u,HZ-80*u);ctx.lineTo(sx+5*u,HZ-80*u);ctx.lineTo(sx+8*u,HZ-36*u);ctx.fill();ctx.fillRect(sx-3.5*u,HZ-92*u,7*u,13*u);ctx.fillRect(sx+3*u,HZ-112*u,4*u,34*u);for(let i=-2;i<=2;i++)ctx.fillRect(sx+i*2.6*u-.6*u,HZ-98*u,1.2*u,6*u);ctx.fillStyle='#f5c542';ctx.fillRect(sx+2*u,HZ-122*u,6*u,10*u)}

function draw(){const D=[90,140,200][cfg.gfx],bi=Math.floor(pos/SL)%N,off=pos%SL,base=segs[bi];
 lamps.length=0;neons.length=0;PL=PAL[tod()];skyline();ctx.fillStyle=base.z?'#2d6a9c':'#8a8880';ctx.fillRect(0,HZ,W,H-HZ);

  for(const sd of[-1,1]){const ah=a.sc*380*W/2,bh=b.sc*380*W/2;ctx.fillStyle=al?'#b4b0a8':'#a6a29a';ctx.beginPath();ctx.moveTo(a.x+sd*a.w*1.06,a.y);ctx.lineTo(b.x+sd*b.w*1.06,b.y);ctx.lineTo(b.x+sd*b.w*1.06,b.y-bh);ctx.lineTo(a.x+sd*a.w*1.06,a.y-ah);ctx.fill();
